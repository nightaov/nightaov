    <style>
        :root[data-theme="dark"] {
            --bg-main: #060916;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(16, 24, 48, 0.56);
            --glass-card: rgba(12, 19, 38, 0.72);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-highlight: rgba(255, 255, 255, 0.38);
            --glass-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), inset 0 1px 1.5px rgba(255, 255, 255, 0.25);
            --btn-key-bg: rgba(15, 23, 42, 0.75);
            --snow-color: #e0f2fe;
            --snow-glow: rgba(56, 189, 248, 0.9);
        }

        :root[data-theme="light"] {
            --bg-main: #eaf2ff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --glass-bg: rgba(255, 255, 255, 0.68);
            --glass-card: rgba(255, 255, 255, 0.82);
            --glass-border: rgba(255, 255, 255, 0.92);
            --glass-highlight: rgba(255, 255, 255, 0.98);
            --glass-shadow: 0 12px 28px rgba(30, 41, 59, 0.1), inset 0 1.5px 2px rgba(255, 255, 255, 0.95);
            --btn-key-bg: rgba(241, 245, 249, 0.9);
            --snow-color: #0284c7;
            --snow-glow: rgba(14, 165, 233, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.35s ease, color 0.35s ease;
            position: relative;
            user-select: none;
        }

        @keyframes spin360 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes spinReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.06); opacity: 1; }
        }

        /* =========================================================
           HIỆU ỨNG CỰC QUANG & TUYẾT RƠI (SNOWFALL) TOÀN TRANG
        ========================================================== */
        .aurora-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .aurora-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatBlob 14s infinite alternate ease-in-out;
        }
        .blob-1 { width: 290px; height: 290px; background: #ef4444; top: -60px; left: -70px; }
        .blob-2 { width: 320px; height: 320px; background: #38bdf8; top: 30%; right: -90px; animation-delay: -4s; }
        .blob-3 { width: 280px; height: 280px; background: #a855f7; bottom: -50px; left: 15%; animation-delay: -8s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 35px) scale(1.12); }
        }

        #snowCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 2147483646;
        }

        #snow-crystal-layer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none !important;
            z-index: 45;
            overflow: hidden;
        }
        .snow-crystal {
            position: absolute;
            top: -40px;
            color: var(--snow-color);
            text-shadow: 0 0 8px var(--snow-glow);
            pointer-events: none !important;
            will-change: transform;
            animation: crystalFall linear infinite;
        }
        @keyframes crystalFall {
            0% { transform: translate3d(0, -5vh, 0) rotate(0deg); }
            50% { transform: translate3d(var(--sway, 22px), 50vh, 0) rotate(180deg); }
            100% { transform: translate3d(calc(var(--sway, 22px) * -0.6), 108vh, 0) rotate(360deg); }
        }

        /* =========================================================
           CHUẨN iOS LIQUID GLASS
        ========================================================== */
        .liquid-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        .liquid-card {
            background: var(--glass-card);
            backdrop-filter: blur(26px) saturate(190%);
            -webkit-backdrop-filter: blur(26px) saturate(190%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 26px;
            padding: 15px;
        }

            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            padding: 14px 14px 100px;

        /* Thanh LIVE chạy chữ */
        .marquee-bar {

    <script>
        /* =========================================================================
           1. ĐỒNG BỘ LOGO & MÀN HÌNH LOAD 3.5 GIÂY (KHÔNG BAO GIỜ BỊ MẤT)

        const DEFAULT_PRESET_LOGO = "https://i.ibb.co/Qv68ykM6/A9-EF44-C3-5-C89-4-D03-BC39-BC355-B33-BD74.png";
        let loaderTimer = null;

        function applyCustomBranding() {
            const cfg = window.CAI_DAT_WEB || {};
            const loaderImg = document.getElementById("loader-img");
            const mainAvatar = document.getElementById("main-avatar");

            // Hỗ trợ cả 2 cách: Sửa ở CAI_DAT_WEB hoặc sửa trực tiếp trong thẻ <img> HTML
            const htmlLoaderSrc = loaderImg ? loaderImg.getAttribute("src") : "";
            const htmlMainSrc = mainAvatar ? mainAvatar.getAttribute("src") : "";

            if (loaderImg) {
                if (htmlLoaderSrc && htmlLoaderSrc !== DEFAULT_PRESET_LOGO) {
                    loaderImg.src = htmlLoaderSrc;
                } else if (cfg.logoManHinhLoad && cfg.logoManHinhLoad.trim() !== "") {
                    loaderImg.src = cfg.logoManHinhLoad.trim();
                }
            }

            if (mainAvatar) {
                if (htmlMainSrc && htmlMainSrc !== DEFAULT_PRESET_LOGO) {
                    mainAvatar.src = htmlMainSrc;
                } else if (cfg.logoDauTrang && cfg.logoDauTrang.trim() !== "") {
                    mainAvatar.src = cfg.logoDauTrang.trim();
                }
            }

            if (cfg.tenHienThi) {
                document.getElementById("profile-name").textContent = cfg.tenHienThi;
                document.getElementById("loader-title").textContent = cfg.tenHienThi + " VIP HUB";
            }
            if (cfg.dongChao) document.getElementById("profile-hi").textContent = cfg.dongChao;
            if (cfg.ngheNghiep) document.getElementById("profile-job").textContent = cfg.ngheNghiep;
            if (cfg.linkTelegram) document.getElementById("btn-telegram").href = cfg.linkTelegram;
            if (cfg.linkTikTok) document.getElementById("btn-tiktok").href = cfg.linkTikTok;
            if (cfg.linkDiscord) document.getElementById("btn-discord").href = cfg.linkDiscord;
            if (cfg.thongBaoLive) document.getElementById("marquee-content").textContent = cfg.thongBaoLive;
        }

        function startLoadingSequence() {
            const overlay = document.getElementById("loader-overlay");
            const bar = document.getElementById("loader-bar");
            const pctTxt = document.getElementById("loader-pct");
            const statusTxt = document.getElementById("loader-status");
            if (!overlay) return;

            if (loaderTimer) clearInterval(loaderTimer);

            // Hiển thị rõ màn hình load từ 0%
            overlay.style.display = "flex";
            overlay.style.opacity = "1";
            overlay.style.visibility = "visible";
            overlay.style.pointerEvents = "auto";
            if (bar) bar.style.width = "0%";
            if (pctTxt) pctTxt.textContent = "0%";
            if (statusTxt) statusTxt.textContent = "Đang tải tài nguyên & bảo mật Anti-Ban...";

            let pct = 0;
            // Đợi trình duyệt vẽ xong khung đầu tiên rồi đếm từ 0% -> 100% trong 3.5 giây
            setTimeout(() => {
                loaderTimer = setInterval(() => {
                    pct += 1;
                    if (pct > 100) pct = 100;
                    if (bar) bar.style.width = pct + "%";
                    if (pctTxt) pctTxt.textContent = pct + "%";

                    if (pct === 45 && statusTxt) {
                        statusTxt.textContent = "Đang kích hoạt giao diện iOS Liquid Glass...";
                    } else if (pct === 85 && statusTxt) {
                        statusTxt.textContent = "Hoàn tất! Đang mở Hub VIP...";
                    }

                    if (pct >= 100) {
                        clearInterval(loaderTimer);
                        setTimeout(() => {
                            overlay.style.opacity = "0";
                            overlay.style.visibility = "hidden";
                            overlay.style.pointerEvents = "none";
                        }, 250);
                    }
                }, 32);
            }, 150);
        }

        function replayLoadingScreen() {
            applyCustomBranding();
            startLoadingSequence();
        }

        /* =========================================================================
           2. HIỆU ỨNG TUYẾT RƠI (SNOWFALL CANVAS + BÔNG TUYẾT ❄ ❅ ❆)
           ========================================================================= */
        (function initSnowfallEffect() {
            // Lớp 1: Bông tuyết tinh thể ❄ ❅ ❆
            const crystalLayer = document.getElementById("snow-crystal-layer");
            if (crystalLayer) {
                const chars = ["❄", "❅", "❆", "•"];
                for (let i = 0; i < 28; i++) {
                    const span = document.createElement("span");
                    span.className = "snow-crystal";
                    span.textContent = chars[i % chars.length];
                    span.style.left = (Math.random() * 100) + "vw";
                    span.style.fontSize = (10 + Math.random() * 12) + "px";
                    span.style.opacity = (0.4 + Math.random() * 0.55).toFixed(2);
                    span.style.setProperty("--sway", ((Math.random() > 0.5 ? 1 : -1) * (15 + Math.random() * 25)) + "px");
                    span.style.animationDuration = (6 + Math.random() * 7) + "s";
                    span.style.animationDelay = (-Math.random() * 12) + "s";
                    crystalLayer.appendChild(span);
                }
            }

            // Lớp 2: Hạt tuyết mịn Canvas 60fps (hiển thị cả trên màn hình Load)
            const canvas = document.getElementById("snowCanvas");
            if (!canvas) return;
            const ctx = canvas.getContext("2d");
            let flakes = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resize);
            resize();

            for (let i = 0; i < 45; i++) {
                flakes.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2.2 + 0.8,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: Math.random() * 1.1 + 0.5,
                    alpha: Math.random() * 0.55 + 0.25
                });
            }

            function drawSnow() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < flakes.length; i++) {
                    const f = flakes[i];
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(224, 242, 254, ${f.alpha})`;
                    ctx.fill();

                    f.x += f.vx;
                    f.y += f.vy;
                    if (f.y > canvas.height + 5) {
                        f.y = -5;
                        f.x = Math.random() * canvas.width;
                    }
                    if (f.x > canvas.width + 5) f.x = -5;
                    if (f.x < -5) f.x = canvas.width + 5;
                }
                requestAnimationFrame(drawSnow);
            }
            drawSnow();
        })();

        /* =========================================================================
           3. DANH MỤC GAME NÚT VUÔNG ICON-ONLY & DANH SÁCH THẺ SCRIPT
           ========================================================================= */
        const ALL_CAT = "__ALL__";
        let activeCategory = Object.keys((window.CAI_DAT_WEB && window.CAI_DAT_WEB.categories) || {})[0] || ALL_CAT;
        const STORAGE_PREFIX = ((window.CAI_DAT_WEB && window.CAI_DAT_WEB.counterNamespace) || "phucaov_v1") + "_";

        function getCategoryIconMarkup(catName, catObj) {
            if (catObj && catObj.icon && catObj.icon.trim() !== "") {
                return `<img src="${catObj.icon.trim()}" alt="${catName}" style="width: 42px; height: 42px; border-radius: 13px; object-fit: cover;">`;
            }

            if (catName === ALL_CAT) {
                return `
                <div style="width: 42px; height: 42px; border-radius: 13px; background: #0c162d; border: 1px solid rgba(56,189,248,0.4); display: flex; align-items: center; justify-content: center;">
                    <svg style="width: 24px; height: 24px;" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="3" width="7.5" height="7.5" rx="2" fill="#38bdf8"/>
                        <rect x="13.5" y="3" width="7.5" height="7.5" rx="2" fill="#a855f7"/>
                        <rect x="3" y="13.5" width="7.5" height="7.5" rx="2" fill="#f97316"/>
                        <rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" fill="#22c55e"/>
                    </svg>
                </div>`;
            }

            const t = (catObj && catObj.defaultType) || "";
            if (t === "8bp" || catName.toLowerCase().includes("8 ball")) {
                return `
                <div style="width: 42px; height: 42px; border-radius: 13px; background: #090d16; border: 1px solid rgba(56,189,248,0.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(56,189,248,0.35);">
                    <svg style="width: 30px; height: 30px;" viewBox="0 0 64 64" fill="none">
                        <circle cx="32" cy="32" r="25" fill="#050811" stroke="#38bdf8" stroke-width="2.5"/>
                        <circle cx="32" cy="32" r="11.5" fill="#ffffff"/>
                        <text x="32" y="37" text-anchor="middle" fill="#050811" font-size="15" font-weight="900">8</text>
                    </svg>
                </div>`;
            }

            if (t === "ff" || catName.toLowerCase().includes("free fire")) {
                return `
                <div style="width: 42px; height: 42px; border-radius: 13px; background: #2a0a10; border: 1px solid rgba(249,115,22,0.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(249,115,22,0.4);">
                    <svg style="width: 26px; height: 26px;" viewBox="0 0 64 64" fill="none">
                        <path d="M34 7 C39 18 52 22 50 38 C48 49 39 56 32 57 C23 56 14 48 14 36 C14 27 21 20 24 15 C23 23 27 26 29 23 C31 19 31 12 34 7 Z" fill="#f97316"/>
                        <path d="M32 18 L39 34 L32 52 L25 34 Z" fill="#fef08a"/>
                    </svg>
                </div>`;
            }

            return `
            <div style="width: 42px; height: 42px; border-radius: 13px; background: #111c38; border: 1px solid rgba(245,158,11,0.5); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 12px rgba(245,158,11,0.4);">
                <svg style="width: 26px; height: 26px;" viewBox="0 0 64 64" fill="none">
                    <path d="M32 6 L54 15 L49 41 L32 58 L15 41 L10 15 Z" fill="#f59e0b"/>
                    <path d="M32 11 L48 18 L44 39 L32 52 L20 39 L16 18 Z" fill="#0c1938"/>
                    <polygon points="32,18 41,29 32,43 23,29" fill="#38bdf8"/>
                </svg>
            </div>`;
        }

        function renderCategories() {
            const row = document.getElementById("category-row");
            if (!row) return;
            row.innerHTML = "";

            const cats = (window.CAI_DAT_WEB && window.CAI_DAT_WEB.categories) || {};
            const keys = Object.keys(cats);
            let totalCount = 0;
            keys.forEach(k => { totalCount += ((cats[k] && cats[k].items) || []).length; });

            [...keys, ALL_CAT].forEach(key => {
                const isAll = (key === ALL_CAT);
                const catObj = isAll ? {} : cats[key];
                const count = isAll ? totalCount : ((catObj.items || []).length);
                const isActive = (activeCategory === key);

                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "sq-btn liquid-glass" + (isActive ? " active-cat" : "");
                btn.title = isAll ? "Tất Cả" : key;
                btn.onclick = () => {
                    activeCategory = key;
                    renderCategories();
                    renderCards();
                };
                btn.innerHTML = `
                    ${getCategoryIconMarkup(key, catObj)}
                    <span class="cat-count">${count}</span>
                    ${isActive ? '<span class="cat-dot"></span>' : ''}
                `;
                row.appendChild(btn);
            });
        }

        function formatNum(n) {
            return Number(n || 0).toLocaleString("en-US");
        }

        function renderCards() {
            const container = document.getElementById("cards-container");
            if (!container) return;
            container.innerHTML = "";

            const cats = (window.CAI_DAT_WEB && window.CAI_DAT_WEB.categories) || {};
            const keyword = (document.getElementById("search-input")?.value || "").trim().toLowerCase();
            let list = [];

            if (activeCategory === ALL_CAT) {
                Object.keys(cats).forEach(catName => {
                    (cats[catName].items || []).forEach(it => list.push({ ...it, _catName: catName }));
                });
            } else if (cats[activeCategory]) {
                list = (cats[activeCategory].items || []).map(it => ({ ...it, _catName: activeCategory }));
            }

            if (keyword) {
                list = list.filter(it =>
                    (it.title || "").toLowerCase().includes(keyword) ||
                    (it._catName || "").toLowerCase().includes(keyword)
                );
            }

            list.forEach((item, idx) => {
                const itemId = item.id || ("item_" + idx);
                const savedClicks = parseInt(localStorage.getItem(STORAGE_PREFIX + "item_" + itemId) || "0", 10);
                const dlUrl = item.linkTai || item.downloadLink || "#";
                const keyUrl = item.linkGetKey || item.keyLink || "#";

                const bannerHtml = (item.banner && item.banner.trim() !== "")
                    ? `<img src="${item.banner.trim()}" alt="${item.title}">`
                    : `<div style="width: 100%; height: 100%; background: linear-gradient(135deg, #132347 0%, #070d1d 100%); display: flex; align-items: center; justify-content: center; padding: 16px;">
                           <span style="color: #38bdf8; font-weight: 900; font-size: 23px; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 14px rgba(56,189,248,0.5);">
                               ${item._catName || "HACK VIP"}
                           </span>
                       </div>`;

                const badgeHtml = (item.badge && item.badge.trim() !== "")
                    ? `<div class="badge-corner">${item.badge}</div>`
                    : "";

                const card = document.createElement("div");
                card.className = "liquid-card";
                card.innerHTML = `
                    <div class="banner-box">
                        ${bannerHtml}
                        ${badgeHtml}
                    </div>
                    <div class="meta-row">
                        <span>📅 Ngày up: <strong>${item.date}</strong></span>
                        <span class="pill-working">Working</span>
                        <span id="item-clicks-${itemId}" class="pill-clicks">🔥 ${formatNum(savedClicks)} lượt lấy</span>
                    </div>
                    <div class="script-title">${item.title}</div>
                    <div class="btn-grid">
                        <a href="${dlUrl}" target="_blank" rel="noopener noreferrer"
                           class="action-btn btn-dl"
                           onclick="handleScriptClick('${itemId}', 'Link Tải')">
                            <span>Link Tải</span>
                            <span>📥</span>
                        </a>
                        <a href="${keyUrl}" target="_blank" rel="noopener noreferrer"
                           class="action-btn btn-key"
                           onclick="handleScriptClick('${itemId}', 'Get Key')">
                            <span>🔑</span>
                            <span>Get Key</span>
                        </a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        /* =========================================================================
           4. BỘ ĐẾM TRUY CẬP & LẤY SCRIPT THẬT BẮT ĐẦU TỪ 0 (TỰ NHẢY TRÊN GITHUB)
           ========================================================================= */
        let visitedCount = parseInt(localStorage.getItem(STORAGE_PREFIX + "visited") || "0", 10);
        let totalClicksCount = parseInt(localStorage.getItem(STORAGE_PREFIX + "clicks") || "0", 10);

        function updateCounterUI(popId) {
            const vEl = document.getElementById("stat-visited");
            const cEl = document.getElementById("stat-clicks");
            if (vEl) vEl.textContent = formatNum(visitedCount);
            if (cEl) cEl.textContent = formatNum(totalClicksCount);

            if (popId) {
                const target = document.getElementById(popId);
                if (target) {
                    target.classList.add("pop");
                    setTimeout(() => target.classList.remove("pop"), 220);
                }
            }
        }

        async function initRealCounters() {
            visitedCount += 1;
            localStorage.setItem(STORAGE_PREFIX + "visited", visitedCount);
            updateCounterUI("stat-visited");

            const ns = encodeURIComponent((window.CAI_DAT_WEB && window.CAI_DAT_WEB.counterNamespace) || "phucaov_v1");
            try {
                const resV = await fetch(`https://api.counterapi.dev/v1/${ns}/visits/up`);
                if (resV.ok) {
                    const dataV = await resV.json();
                    if (typeof dataV.count === "number") {
                        visitedCount = Math.max(visitedCount, dataV.count);
                        localStorage.setItem(STORAGE_PREFIX + "visited", visitedCount);
                        updateCounterUI("stat-visited");
                    }
                }
            } catch (e) {}

            try {
                const resC = await fetch(`https://api.counterapi.dev/v1/${ns}/clicks/`);
                if (resC.ok) {
                    const dataC = await resC.json();
                    if (typeof dataC.count === "number") {
                        totalClicksCount = Math.max(totalClicksCount, dataC.count);
                        localStorage.setItem(STORAGE_PREFIX + "clicks", totalClicksCount);
                        updateCounterUI();
                    }
                }
            } catch (e) {}
        }

        async function handleScriptClick(itemId, label) {
            totalClicksCount += 1;
            localStorage.setItem(STORAGE_PREFIX + "clicks", totalClicksCount);
            updateCounterUI("stat-clicks");

            const itemKey = STORAGE_PREFIX + "item_" + itemId;
            const nextVal = parseInt(localStorage.getItem(itemKey) || "0", 10) + 1;
            localStorage.setItem(itemKey, nextVal);
            const badge = document.getElementById("item-clicks-" + itemId);
            if (badge) badge.textContent = "🔥 " + formatNum(nextVal) + " lượt lấy";

            const toast = document.getElementById("toast-msg");
            if (toast) {
                toast.textContent = "🚀 Đang mở " + label + "...";
                toast.style.opacity = "1";
                setTimeout(() => { toast.style.opacity = "0"; }, 1800);
            }

            const ns = encodeURIComponent((window.CAI_DAT_WEB && window.CAI_DAT_WEB.counterNamespace) || "phucaov_v1");
            try {
                const res = await fetch(`https://api.counterapi.dev/v1/${ns}/clicks/up`);
                if (res.ok) {
                    const data = await res.json();
                    if (typeof data.count === "number") {
                        totalClicksCount = Math.max(totalClicksCount, data.count);
                        localStorage.setItem(STORAGE_PREFIX + "clicks", totalClicksCount);
                        updateCounterUI();
                    }
                }
            } catch (e) {}
        }

        /* =========================================================================
           5. ĐỒNG HỒ GIỜ VIỆT NAM, SÁNG/TỐI & NHẠC NỀN TỰ PHÁT KHI CHẠM
           ========================================================================= */
        function updateClock() {
            const now = new Date();
            const vn = new Date(now.toLocaleString("en-US", { timeZone: "Asia/Ho_Chi_Minh" }));
            const h = vn.getHours();
            const m = String(vn.getMinutes()).padStart(2, "0");
            const s = String(vn.getSeconds()).padStart(2, "0");
            const hh = String(h).padStart(2, "0");

            let label = "Night!";
            let icon = "🌙";
            if (h >= 5 && h < 11) { label = "Morning!"; icon = "☀️"; }
            else if (h >= 11 && h < 14) { label = "Noon!"; icon = "🌤️"; }
            else if (h >= 14 && h < 18) { label = "Afternoon!"; icon = "⛅"; }

            const el = document.getElementById("clock-text");
            if (el) el.textContent = `${label} ${hh}:${m}:${s} ${icon}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.getAttribute("data-theme") === "dark";
            root.setAttribute("data-theme", isDark ? "light" : "dark");
            document.getElementById("theme-icon").textContent = isDark ? "🌙" : "☀️";
            document.getElementById("theme-label").textContent = isDark ? "Dark" : "Light";
        }

        const audioEl = document.getElementById("bg-audio");
        if (audioEl && window.CAI_DAT_WEB && window.CAI_DAT_WEB.linkNhacNen) {
            audioEl.src = window.CAI_DAT_WEB.linkNhacNen;
        }
        let musicStarted = false;

        function unlockAudio() {
            if (musicStarted || !audioEl) return;
            audioEl.volume = 1.0;
            audioEl.play().then(() => {
                musicStarted = true;
                document.getElementById("music-disc").style.animation = "spin360 3s linear infinite";
                document.getElementById("music-label").textContent = "Nhạc: Đang phát";
            }).catch(() => {});
        }
        ["touchstart", "touchend", "click"].forEach(evt => {
            document.addEventListener(evt, unlockAudio, { passive: true });
        });

        function toggleMusicManual(e) {
            if (e) e.stopPropagation();
            if (!audioEl) return;
            if (audioEl.paused) {
                audioEl.play();
                musicStarted = true;
                document.getElementById("music-disc").style.animation = "spin360 3s linear infinite";
                document.getElementById("music-label").textContent = "Nhạc: Đang phát";
            } else {
                audioEl.pause();
                document.getElementById("music-disc").style.animation = "none";
                document.getElementById("music-label").textContent = "Nhạc: Đã tắt";
            }
        }

        // Khởi chạy ngay lập tức
        applyCustomBranding();
        startLoadingSequence();
        renderCategories();
        renderCards();
        initRealCounters();
    </script>
</body>
</html>
